; ═══════════════════════════════════════════════════════════════════════════
;  ToFi X Tv — HLS live worker (Supervisor)
;  انسخ الملف إلى:  /etc/supervisor/conf.d/tofi-hls-worker.conf
;  ثم:              supervisorctl reread && supervisorctl update
; ═══════════════════════════════════════════════════════════════════════════

[program:tofi-hls-worker]
command=/usr/bin/php /var/www/live-api/worker.php
directory=/var/www/live-api

; عدّل المستخدم بما يطابق مستخدم الويب على سيرفرك.
user=www-data

environment=TOFI_MODE="worker",TOFI_WORKER_CHANNELS="10"
; environment=...,TOFI_TOKEN_SECRET="change-me",TOFI_STREAM_SIGNING_SECRET="change-me"
; environment=...,TOFI_VIEWER_BACKEND="redis"

autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10

redirect_stderr=true
stdout_logfile=/var/log/tofi-hls-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; مهم: إن توقف هذا البرنامج لأي سبب يستمر البث بوضع request_driven تلقائيًا،
; لأن index.php يستخدم نفس الكاش ونفس آلية القفل.
